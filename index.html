<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حديد — تمارين وتغذية</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="حديد">
<meta name="theme-color" content="#17202A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --concrete:#ECEDEA;
  --paper:#FFFFFF;
  --ink:#17202A;
  --steel:#5E6871;
  --line:#D5D7D2;
  --blue:#0E4FA8;   /* 20kg */
  --red:#C1121F;    /* 25kg */
  --yellow:#E8A712;  /* 15kg */
  --green:#1E7F4F;  /* 10kg */
  --r:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--concrete);color:var(--ink);
  font-family:'IBM Plex Sans Arabic',system-ui,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.55;
  font-variant-numeric:tabular-nums;
  padding-bottom:96px;
}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.2}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* header */
header{background:var(--ink);color:#fff;padding:14px 0 0}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:20px;letter-spacing:-.03em}
.logo span{color:var(--yellow)}
.hd small{color:#9BA6B0;font-size:13px}
.plates{display:flex;height:5px;margin-top:12px}
.plates i{flex:1}
.p-blue{background:var(--blue)}.p-red{background:var(--red)}
.p-yellow{background:var(--yellow)}.p-green{background:var(--green)}

/* nav */
nav{position:fixed;bottom:0;right:0;left:0;background:var(--paper);border-top:1px solid var(--line);z-index:40}
.navin{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:12px 2px 18px;color:var(--steel);font-size:12px;font-weight:500;border-top:3px solid transparent;margin-top:-1px}
nav button.on{color:var(--ink);border-top-color:var(--blue);font-weight:700}

/* blocks */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sec{margin:24px 0 10px;font-size:14px;font-weight:600;color:var(--steel)}
.muted{color:var(--steel);font-size:14px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:var(--r);padding:14px 20px;font-weight:600;width:100%}
.btn:disabled{background:#A9AFB4}
.btn.blue{background:var(--blue)}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 14px;width:auto;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* setup */
.hero{padding:28px 0 20px}
.hero h1{font-size:clamp(30px,8vw,44px)}
.hero p{color:var(--steel);margin:10px 0 0;max-width:56ch}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;text-align:right}
.opt.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--blue)}
.opt b{font-weight:600}
.opt em{font-style:normal;color:var(--steel);font-size:13px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:10px 13px;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps{display:flex;gap:6px;margin:16px 0 4px}
.steps i{height:3px;flex:1;background:var(--line)}
.steps i.on{background:var(--ink)}

/* day cards */
.day{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.day-top{display:flex;align-items:center;gap:12px;padding:14px 16px}
.tag{width:6px;align-self:stretch;border-radius:2px}
.day h3{font-size:17px}
.day .muted{font-size:13px}
.exlist{border-top:1px solid var(--line);padding:6px 16px 12px}
.exrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.exrow:last-child{border-bottom:0}
.exrow span{color:var(--steel);font-size:14px;white-space:nowrap}

/* session */
.exblock{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.exhead{padding:13px 15px;border-bottom:1px solid var(--line)}
.exhead h3{font-size:16px}
.exhead .muted{font-size:13px;margin-top:2px}
.sets{padding:6px 10px 12px}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:8px;align-items:center;padding:6px 4px}
.setrow.head{color:var(--steel);font-size:12px;font-weight:600;padding-bottom:2px}
.setrow input{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:11px 8px;text-align:center;background:#FAFAF9}
.setrow input:focus{outline:2px solid var(--blue);outline-offset:-1px;background:#fff}
.setrow.done input{background:#EAF3EA;border-color:#BEDCC6}
.tick{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);height:42px;font-size:17px;color:var(--steel)}
.tick.on{background:var(--green);border-color:var(--green);color:#fff}
.num{font-weight:600;color:var(--steel);text-align:center;font-size:14px}
.exfoot{display:flex;gap:8px;padding:0 12px 12px}
.linkbtn{background:none;border:0;color:var(--blue);font-size:14px;font-weight:600;padding:6px 0}

/* timer */
.timer{position:fixed;bottom:70px;right:0;left:0;z-index:50;pointer-events:none}
.timer-in{max-width:720px;margin:0 auto;padding:0 16px}
.timer-bx{background:var(--red);color:#fff;border-radius:var(--r);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:auto}
.timer-bx b{font-size:26px;font-weight:700;letter-spacing:-.02em}
.timer-bx button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:var(--r);padding:8px 12px;font-weight:600;font-size:14px}
.hidden{display:none!important}

/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em}
.stat em{font-style:normal;color:var(--steel);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:right;padding:9px 4px;border-bottom:1px solid var(--line)}
th{color:var(--steel);font-weight:600;font-size:13px}
.empty{text-align:center;color:var(--steel);padding:34px 16px}
/* أنيميشن التمرين */
.anim{width:118px;height:118px;flex:0 0 118px;background:#F6F6F4;border:1px solid var(--line);border-radius:var(--r)}
.anim .fig{fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.anim .load{fill:var(--blue)}
.anim .gr{transform-box:view-box}
@keyframes kfY{0%,100%{transform:translateY(0)}50%{transform:translateY(15px)}}
@keyframes kfYup{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes kfX{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
@keyframes kfR{0%,100%{transform:rotate(0)}50%{transform:rotate(-48deg)}}
@keyframes kfR2{0%,100%{transform:rotate(0)}50%{transform:rotate(46deg)}}
@keyframes kfSw{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
@media(prefers-reduced-motion:reduce){.anim *{animation:none!important}}
/* خريطة العضلات */
.figrow{display:flex;gap:14px;align-items:center}
.map{display:flex;gap:10px;justify-content:center;padding:6px 0}
.map svg{height:186px}
.map text{font-size:8px;fill:var(--steel);font-family:inherit}
.leg{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--steel);margin-top:4px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:5px;vertical-align:-1px}
.mtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mtag{font-size:13px;border:1px solid var(--line);border-radius:var(--r);padding:5px 9px}
.mtag.pri{background:var(--red);color:#fff;border-color:var(--red)}
/* التكنيك */
.cue{counter-reset:c;list-style:none;padding:0;margin:6px 0 0}
.cue li{position:relative;padding:8px 28px 8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.cue li:last-child{border-bottom:0}
.cue li:before{counter-increment:c;content:counter(c);position:absolute;right:0;top:9px;width:19px;height:19px;background:var(--blue);color:#fff;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.err{background:#FCF0F1;border-right:3px solid var(--red);padding:10px 12px;border-radius:var(--r);font-size:14px;margin-top:8px}
.vid{display:block;text-align:center;background:var(--red);color:#fff;text-decoration:none;padding:13px;border-radius:var(--r);font-weight:600;margin-top:16px}
.timer-bx.work{background:var(--blue)}
.play{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);height:42px;color:var(--blue);font-weight:700}
.exname{background:none;border:0;padding:0;font:inherit;font-weight:700;font-size:16px;color:var(--ink);text-align:right;border-bottom:1px dashed var(--steel)}
.sheet{position:fixed;inset:0;background:rgba(23,32,42,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--paper);width:100%;max-width:720px;max-height:80vh;overflow:auto;border-radius:var(--r) var(--r) 0 0;padding:18px 16px 28px}
@media(prefers-reduced-motion:no-preference){.timer-bx{transition:background .2s}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hd">
      <div class="logo">حديـ<span>د</span></div>
      <small id="hdInfo"></small>
    </div>
    <div class="plates"><i class="p-blue"></i><i class="p-red"></i><i class="p-yellow"></i><i class="p-green"></i></div>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="timer hidden" id="timerBar">
  <div class="timer-in">
    <div class="timer-bx">
      <div><b id="timerVal">01:30</b><div id="timerLbl" style="font-size:13px;opacity:.85">راحة</div></div>
      <div class="row">
        <button onclick="addRest(30)">+٣٠ث</button>
        <button onclick="stopRest()">تخطي</button>
      </div>
    </div>
  </div>
</div>

<nav id="nav" class="hidden">
  <div class="navin">
    <button data-t="today" class="on">اليوم</button>
    <button data-t="program">البرنامج</button>
    <button data-t="meals">الأكل</button>
    <button data-t="progress">التقدم</button>
    <button data-t="settings">الإعدادات</button>
  </div>
</nav>

async function load(){
  try{const r=await window.storage.get(KEY); if(r&&r.value){S=Object.assign(S,JSON.parse(r.value));return;}}catch(e){}
  try{const t=localStorage.getItem(KEY); if(t)S=Object.assign(S,JSON.parse(t));}catch(e){}
}

  let ok=false;
  try{await window.storage.set(KEY,JSON.stringify(S));ok=true;}catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(S));ok=true;}catch(e){}

}

/* ============ 3. توليد البرنامج ============ */
function avail(eq){return EX.filter(x=>x.e.every(r=>eq.includes(r)));}
function pick(pool,pattern,used,offset){
  const c=pool.filter(x=>x.p===pattern&&!used.has(x.id));
  if(!c.length) return null;
  return c[offset%c.length];
}
function build(cfg){
  const pool=avail(cfg.eq), g=GOALS[cfg.goal], lvl=LEVELS[cfg.level];
  const cap=Math.min(lvl.max, cfg.time>=75?7:cfg.time>=60?6:5);
  const days=TPL[cfg.days].map((d,di)=>{
    const used=new Set(); const ex=[];
    for(const slot of d.s){
      if(slot==='cardio'){ if(!g.cardio||ex.length>=cap+1) continue; }
      else if(ex.length>=cap) continue;
      const e=pick(pool,slot,used,di);
      if(!e) continue;
      used.add(e.id);
      if(slot==='cardio'){ ex.push({id:e.id,slot,sets:1,lo:15,hi:20,rest:0,cardio:true}); }
      else{ const s=e.t==='c'?g.c:g.i; ex.push({id:e.id,slot,sets:s.sets,lo:s.lo,hi:s.hi,rest:s.rest}); }
    }
    const minEx=Math.min(4,cap);
    if(ex.filter(e=>!e.cardio).length<minEx){
      for(const slot of [...new Set(d.s.filter(s=>s!=='cardio'))]){
        if(ex.filter(e=>!e.cardio).length>=minEx) break;
        const alt=pool.filter(x=>x.p===slot&&!used.has(x.id));
        if(!alt.length) continue;
        const e=alt[0]; used.add(e.id);
        const s=e.t==='c'?g.c:g.i;
        ex.push({id:e.id,slot,sets:s.sets,lo:s.lo,hi:s.hi,rest:s.rest});
      }
    }
    ex.sort((a,b)=>(a.cardio?1:0)-(b.cardio?1:0));
    return {n:d.n,c:d.c,k:d.k,ex};
  });
  return {days,created:today()};
}

function splitName(d){return {3:'تقسيمة كامل الجسم ٣ أيام',4:'تقسيمة علوي / سفلي',5:'دفع — سحب — أرجل + علوي وسفلي',6:'دفع — سحب — أرجل مرتين بالأسبوع'}[d];}

/* ============ 5. اليوم ============ */

  const done=Object.values(S.logs).filter(l=>l.done).sort((a,b)=>a.ts-b.ts);
  if(!done.length) return 0;
  return (done[done.length-1].di+1)%S.program.days.length;
}
function todayView(){

function estTime(d){return d.ex.reduce((a,e)=>a+(e.cardio?e.hi:e.sets*(e.rest+40)/60),0)|0;}

/* ============ 6. الحصة ============ */
function startSession(di){
  const d=S.program.days[di];
  S.session={di,date:today(),ts:Date.now(),entries:{}};
  d.ex.forEach(e=>{S.session.entries[e.id]=Array.from({length:e.sets},()=>({w:'',r:'',ok:false}));});
  save();render();
}
function lastFor(exId){
  const ls=Object.values(S.logs).filter(l=>l.entries&&l.entries[exId]).sort((a,b)=>b.ts-a.ts);
  return ls.length?ls[0].entries[exId]:null;
}
function suggest(e){
  const last=lastFor(e.id); if(!last) return null;
  const sets=last.filter(s=>s.ok&&s.w!==''&&s.r!=='');
  if(!sets.length) return null;
  const w=Math.max(...sets.map(s=>+s.w||0));
  const allTop=sets.length>=e.sets&&sets.every(s=>+s.r>=e.hi);
  const inc=['squat','hinge','ham','quad','calf','glute'].includes(e.slot)?5:2.5;
  return {w,next:allTop?w+inc:w,up:allTop};
}
function sessionView(){
  const d=S.program.days[S.session.di];
  const total=d.ex.reduce((a,e)=>a+e.sets,0);
  const done=Object.values(S.session.entries).flat().filter(s=>s.ok).length;
  return `<div style="padding:18px 0 10px">
      <div class="between"><h1 style="font-size:26px">${d.n}</h1>
      <button class="linkbtn" onclick="cancelSession()">إلغاء</button></div>
      <div class="bar" style="margin-top:10px"><i style="width:${Math.round(done/total*100)}%"></i></div>
      <div class="muted" style="margin-top:5px">${done} من ${total} مجموعة</div>
    </div>
    ${d.ex.map((e,ei)=>exBlock(e,ei)).join('')}
    <button class="btn ${done?'blue':''}" onclick="finishSession()" ${done?'':'disabled'} style="margin:6px 0 30px">إنهاء الحصة وحفظها</button>`;
}
function exBlock(e,ei){
  const x=exOf(e.id), sg=suggest(e), rows=S.session.entries[e.id]||[];
  const mu=muOf(e), mtags=mu.m.map(m=>MN[m]).join(' · ');
  if(e.cardio) return `<div class="exblock"><div class="exhead">
      <div class="figrow" style="gap:10px"><div style="transform:scale(.62);transform-origin:right center;width:74px;flex:0 0 74px">${animSVG(e)}</div>
      <div style="flex:1"><button class="exname" onclick="openInfo('${e.id}','${e.slot}')">${esc(x.n)}</button>
      <div class="muted">${e.lo}-${e.hi} دقيقة · ${esc(x.tip)}</div></div></div></div>
      <div class="sets"><div class="setrow" style="grid-template-columns:1fr 42px 42px">
      <input type="number" inputmode="numeric" placeholder="الدقائق" value="${rows[0]?.r||''}" onchange="setVal('${e.id}',0,'r',this.value)">
      <button class="play" onclick="startWork(${e.hi*60},0)" title="عدّاد">▶</button>
      <button class="tick ${rows[0]?.ok?'on':''}" onclick="tick('${e.id}',0,0)">✓</button></div></div></div>`;
  return `<div class="exblock">
    <div class="exhead">
      <div class="figrow" style="gap:10px">
        <div style="transform:scale(.62);transform-origin:right center;width:74px;flex:0 0 74px">${animSVG(e)}</div>
        <div style="flex:1">
          <div class="between"><button class="exname" onclick="openInfo('${e.id}','${e.slot}')">${esc(x.n)}</button>
          <button class="linkbtn" onclick="openSwap(${ei})">تبديل</button></div>
          <div class="muted">${e.sets}×${e.lo}-${e.hi} · راحة ${e.rest}ث</div>
          <div class="muted" style="font-size:12px">${mtags}</div>
        </div>
      </div>
      ${sg?`<div class="muted" style="margin-top:6px;color:${sg.up?'var(--green)':'var(--steel)'}">آخر مرة ${sg.w} كجم — ${sg.up?'ارفع إلى '+sg.next+' كجم':'كرّر '+sg.next+' كجم'}</div>`:''}
    </div>
    <div class="sets">
      <div class="setrow head"><div>م</div><div>الوزن (كجم)</div><div>التكرار</div><div></div><div></div></div>
      ${rows.map((s,i)=>`<div class="setrow ${s.ok?'done':''}">
        <div class="num">${i+1}</div>
        <input type="number" inputmode="decimal" step="0.5" value="${s.w}" placeholder="${sg?sg.next:'—'}" onchange="setVal('${e.id}',${i},'w',this.value)">
        <input type="number" inputmode="numeric" value="${s.r}" placeholder="${e.lo}-${e.hi}" onchange="setVal('${e.id}',${i},'r',this.value)">
        <button class="play" onclick="startWork(${Math.max(20,Math.round(e.hi*3.5))},${e.rest})" title="عدّاد التنفيذ">▶</button>
        <button class="tick ${s.ok?'on':''}" onclick="tick('${e.id}',${i},${e.rest})">✓</button>
      </div>`).join('')}
    </div>
    <div class="exfoot"><button class="linkbtn" onclick="addSet('${e.id}')">+ مجموعة</button>
    ${rows.length>1?`<button class="linkbtn" style="color:var(--steel)" onclick="delSet('${e.id}')">− مجموعة</button>`:''}</div>
  </div>`;
}
function setVal(id,i,k,v){S.session.entries[id][i][k]=v;save();}
function tick(id,i,rest){
  const s=S.session.entries[id][i]; s.ok=!s.ok;
  if(s.ok){ if(s.r===''){const e=curEx(id); s.r=e?e.lo:'';} if(s.w===''){const sg=suggest(curEx(id)); if(sg)s.w=sg.next;} if(rest)startRest(rest); }
  save();render();
}
function curEx(id){return S.program.days[S.session.di].ex.find(e=>e.id===id);}
function addSet(id){S.session.entries[id].push({w:'',r:'',ok:false});save();render();}
function delSet(id){S.session.entries[id].pop();save();render();}
function cancelSession(){if(confirm('تلغي الحصة بدون حفظ؟')){S.session=null;stopRest();save();render();}}
async function finishSession(){
  const s=S.session, key=s.date+'#'+s.ts;
  S.logs[key]={date:s.date,ts:s.ts,di:s.di,done:true,entries:s.entries};
  S.session=null; stopRest(); await save(); tab='progress'; render();
}

/* ============ 7. مؤقت الراحة ============ */
let tId=null,tLeft=0,tMode='rest',tThen=0;
function runTimer(sec,mode,then){
  tLeft=sec; tMode=mode; tThen=then||0;
  const bx=document.querySelector('.timer-bx');
  bx.classList.toggle('work',mode==='work');
  $('timerLbl').textContent=mode==='work'?'تنفيذ التمرين':'راحة';
  $('timerBar').classList.remove('hidden'); paintTimer();
  clearInterval(tId);
  tId=setInterval(()=>{
    tLeft--; paintTimer();
    if(tLeft<=0){ beep();
      if(tMode==='work'&&tThen){ runTimer(tThen,'rest',0); }
      else stopRest();
    }
  },1000);
}
function startWork(sec,rest){runTimer(sec,'work',rest);}
function startRest(sec){runTimer(sec,'rest',0);}
function addRest(s){tLeft+=s;paintTimer();}
function stopRest(){clearInterval(tId);tId=null;$('timerBar').classList.add('hidden');}
function paintTimer(){const m=Math.max(0,tLeft);$('timerVal').textContent=String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function beep(){
  try{navigator.vibrate&&navigator.vibrate([160,80,160]);
    const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
    o.frequency.value=760;o.connect(g);g.connect(a.destination);g.gain.value=.14;o.start();
    setTimeout(()=>{o.stop();a.close();},260);
  }catch(e){}
}

function weekStats(){
  const start=Date.now()-6*864e5;
  const ls=Object.values(S.logs).filter(l=>l.done&&l.ts>=start);
  return {n:ls.length,vol:ls.reduce((a,l)=>a+vol(l),0)|0};
}
function vol(l){let v=0;for(const k in l.entries)for(const s of l.entries[k])if(s.ok)v+=(+s.w||0)*(+s.r||0);return v;}
function progressView(){
  const ls=Object.values(S.logs).filter(l=>l.done).sort((a,b)=>b.ts-a.ts);
  if(!ls.length) return `<div style="padding:20px 0"><h1 style="font-size:28px">التقدم</h1></div>
    <div class="card empty">ما سجّلت أي حصة بعد.<br>أول حصة تكمّلها بتظهر هنا مع الحجم التدريبي وأرقامك القياسية.</div>`;
  const wk=weekStats();
  const prev=Object.values(S.logs).filter(l=>l.done&&l.ts<Date.now()-6*864e5&&l.ts>=Date.now()-13*864e5);
  const pv=prev.reduce((a,l)=>a+vol(l),0)|0;
  const diff=pv?Math.round((wk.vol-pv)/pv*100):null;
  const prs={};
  ls.forEach(l=>{for(const k in l.entries)l.entries[k].forEach(s=>{if(s.ok&&+s.w>(prs[k]?.w||0))prs[k]={w:+s.w,r:+s.r||0};});});
  const top=Object.entries(prs).filter(([k])=>exOf(k)).sort((a,b)=>b[1].w-a[1].w).slice(0,10);
  return `<div style="padding:20px 0 6px"><h1 style="font-size:28px">التقدم</h1></div>

      <div class="stat"><b style="color:${diff===null?'var(--ink)':diff>=0?'var(--green)':'var(--red)'}">${diff===null?'—':(diff>0?'+':'')+diff+'٪'}</b><em>مقارنة بالأسبوع الماضي</em></div>

    <div style="height:30px"></div>`;
}

const byIdR=id=>ALLR().find(r=>r.id===id);

/* ---- الأهداف ---- */
function kcalBase(pf){
  const bmr=pf.sex==='f'?10*pf.w+6.25*pf.h-5*pf.age-161:10*pf.w+6.25*pf.h-5*pf.age+5;
  let t=bmr*({low:1.2,mid:1.45,high:1.7}[pf.act]||1.45);
  if(pf.goal==='cut')t*=.8; if(pf.goal==='gain')t*=1.12;
  return Math.max(pf.sex==='f'?1300:1600,Math.round(t/10)*10);
}
function isTrain(dk){
  const o=(D().days[dk]||{})._tr;
  if(o===0||o===1)return !!o;
  return Object.values(S.logs||{}).some(l=>l.done&&l.date===dk);
}
const TRAIN_BONUS=250;
function kcalTarget(dk){return kcalBase(D().pf)+(isTrain(dk)?TRAIN_BONUS:0)}
function proTarget(){
  const pf=D().pf, g={cut:2.0,gain:1.8,keep:1.6}[pf.goal]||1.7;
  return Math.round(pf.w*g);
}

/* ---- الفلترة والخطة ---- */
function okR(r){
  const d=D();
  if(r.ex.some(t=>d.excl.includes(t)))return false;
  if(d.custom.length){const x=(r.n+" "+r.ing.join(" ")).toLowerCase();
    if(d.custom.some(w=>w.trim()&&x.includes(w.trim().toLowerCase())))return false}
  return true;
}
const poolR=slot=>ALLR().filter(r=>r.m.includes(slot)&&okR(r));
function applyMods(r,mods){
  let k=r.k,p=r.p,c=r.c,f=r.f;const notes=[];
  (mods||[]).forEach(id=>{const m=MODS.find(x=>x.id===id);if(!m)return;
    if(m.scale){k=Math.round(k*m.scale);p=Math.round(p*m.scale);c=Math.round(c*m.scale);f=Math.round(f*m.scale)}
    else{k+=m.k||0;p+=m.p||0;c+=m.c||0;f+=m.f||0}
    notes.push(m.note)});
  return Object.assign({},r,{k:Math.max(60,k),p:Math.max(0,p),c:Math.max(0,c),f:Math.max(0,f),notes});
}
function plan(dk){
  const d=D(), saved=d.days[dk]||{}, T=kcalTarget(dk), seed=saved._seed||0, tr=isTrain(dk);
  const out={}, used=[];
  SLOTS.forEach(([key,,share])=>{
    const P=poolR(key), rec=saved[key]; let base=null;
    if(rec&&rec.custom)base=rec.custom;
    else if(rec&&rec.id)base=byIdR(rec.id);
    if(!base||(!(rec&&rec.custom)&&!okR(base))){
      if(!P.length){out[key]=null;return}
      const sc=T*share;
      let sorted;
      if(tr&&key==='snack')sorted=P.slice().sort((a,b)=>b.p-a.p||Math.abs(a.k-sc)-Math.abs(b.k-sc));
      else sorted=P.slice().sort((a,b)=>Math.abs(a.k-sc)-Math.abs(b.k-sc));
      const top=sorted.slice(0,Math.min(6,sorted.length)).filter(r=>!used.includes(r.id));
      const list=top.length?top:sorted;
      base=list[dhash(dk+key+seed)%list.length];
    }
    used.push(base.id);
    out[key]={r:applyMods(base,rec&&rec.mods),mods:(rec&&rec.mods)||[],done:!!(rec&&rec.done),cust:!!(rec&&rec.custom)};
  });
  return out;
}

}

function lineChart(d,color,unit){
  if(d.length<2)return '<div class="empty">سجّل وزنك في أسبوعين على الأقل عشان يظهر الرسم.</div>';
  const a=d.slice(-8),W=320,H=150,p=30;
  const vs=a.map(x=>x.v),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  const lo=mn-Math.max(.5,(mx-mn)*.25),hi=mx+Math.max(.5,(mx-mn)*.25);
  const X=i=>p+i*(W-p*2)/(a.length-1), Y=v=>H-24-((v-lo)/(hi-lo))*(H-48);
  let g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  g+='<polyline fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" points="'+a.map((x,i)=>X(i)+','+Y(x.v)).join(' ')+'"/>';
  a.forEach((x,i)=>{const dt=new Date(x.w+"T00:00:00");
    g+='<circle cx="'+X(i)+'" cy="'+Y(x.v)+'" r="3.5" fill="'+color+'"/>'+
       '<text x="'+X(i)+'" y="'+(Y(x.v)-9)+'" font-size="10" fill="#17202A" text-anchor="middle">'+x.v+'</text>'+
       '<text x="'+X(i)+'" y="'+(H-6)+'" font-size="9" fill="#5E6871" text-anchor="middle">'+dt.getDate()+'/'+(dt.getMonth()+1)+'</text>'});
  return g+'</svg>';
}

function okC(c){
  if(!c)return true;
  const d=D();
  if(c.ex.some(t=>d.excl.includes(t)))return false;
  if(d.custom.some(w=>w.trim()&&c.n.toLowerCase().includes(w.trim().toLowerCase())))return false;
  return true;
}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const fit=(a,b)=>!a||!b||a.fl==='b'||b.fl==='b'||a.fl===b.fl;
function disp(c,g){
  if(!c)return '';
  if(c.g){let n=g/c.g;
    n=(c.fg.indexOf('wh')>-1)?Math.max(1,Math.round(n)):Math.max(.5,Math.round(n*2)/2);
    return c.n+' '+(n===.5?'نصف '+c.u[0]:n+' '+(n>1?c.u[1]:c.u[0]))}
  return c.n+' '+Math.round(g/5)*5+' جم';
}
const mac=(c,g)=>c?{k:c.k*g/100,p:c.p*g/100,c:c.c*g/100,f:c.f*g/100}:{k:0,p:0,c:0,f:0};
const sum=a=>a.reduce((x,y)=>({k:x.k+y.k,p:x.p+y.p,c:x.c+y.c,f:x.f+y.f}),{k:0,p:0,c:0,f:0});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function makeRecipe(slot){
  const d=D(), share=SLOTS.find(x=>x[0]===slot)[2];
  const K=Math.round(kcalTarget(dk_(dDate))*share), PG=Math.round(proTarget()*share*1.05);
  const bf=slot==='breakfast', sn=slot==='snack', cold=sn;
  const PP=(bf?G.protBf:sn?G.protSn:G.protMain).filter(okC);
  if(!PP.length)return null;
  const P=rnd(PP);
  const CC=(bf?G.carbBf:sn?G.carbSn:G.carbMain).filter(c=>okC(c)&&fit(P,c));
  const VV=sn?[null]:(bf?G.vegBf:G.veg).filter(c=>okC(c)&&fit(P,c));
  const FF=G.fat.filter(c=>okC(c)&&fit(P,c));
  const EE=G.se.filter(x=>!x[1].some(t=>d.excl.includes(t))&&
    !d.custom.some(w=>w.trim()&&x[0].toLowerCase().includes(w.trim().toLowerCase()))&&
    (x[2]===P.fl||P.fl==='b'));
  const C=CC.length?rnd(CC):null, V=VV.length?rnd(VV):null, F=FF.length?rnd(FF):null;
  const E=EE.length?rnd(EE)[0]:'ملح وفلفل أسود';
  const M=rnd(sn?MET_SN:bf?MET_BF:MET);
  const cooked=!cold&&M.n!=='جاهز بارد';
  const raw=!!(V&&V.fg.indexOf('rw')>-1);
  /* دهن الطبخ منفصل عن دهن التزيين */
  let cookF=null,gCook=0;
  if(cooked){cookF=(F&&F.fg.indexOf('ck')>-1)?F:(okC(OIL)?OIL:null);gCook=cookF?12:0}
  const top=(F&&F!==cookF)?F:null;
  let gP=clamp(Math.round(PG/(P.p||1)*100/5)*5,P.lo,P.hi);
  let gTop=top?Math.round(clamp((top.lo+top.hi)/2,top.lo,top.hi)):0;
  let gV=V?Math.round((V.lo+V.hi)/2/10)*10:0;
  let m=sum([mac(P,gP),mac(cookF,gCook),mac(top,gTop),mac(V,gV)]);
  let gC=0;
  if(C){gC=clamp(Math.round((K-m.k)/C.k*100/5)*5,C.lo,C.hi);m=sum([m,mac(C,gC)])}
  if(m.k>K*1.15&&gP>P.lo){const cut=Math.min(gP-P.lo,Math.round((m.k-K)/(P.k||1)*100/5)*5);
    gP-=cut;m=sum([m,{k:-mac(P,cut).k,p:-mac(P,cut).p,c:-mac(P,cut).c,f:-mac(P,cut).f}])}
  if(m.p<PG*.6)return null;                 /* بروتين ضعيف: ارفض */
  if(m.k>K*1.3||m.k<K*.6)return null;       /* بعيد عن هدف السعرات: ارفض */
  const nm=cooked?P.n+' '+M.n+(C?' مع '+C.n:'')+(V?(C?' و':' مع ')+V.n:'')
    :P.n+(C?' مع '+C.n:'')+(top?(C?' و':' مع ')+top.n:'');
  const t=Math.round(M.t[0]+Math.random()*(M.t[1]-M.t[0]));
  const ing=[disp(P,gP)];
  if(C)ing.push(disp(C,gC));
  if(V)ing.push(disp(V,gV));
  if(cookF&&cooked)ing.push(disp(cookF,gCook));
  if(top)ing.push(disp(top,gTop));
  ing.push(E,'ملح وفلفل أسود حسب الرغبة');
  const st=M.s({P:P.n,C:C?C.n:'',V:V?V.n:'',E:E,raw:raw,
    cook:cookF?cookF.n:'رذاذ زيت',top:top?top.n:(cookF?cookF.n:'رشة قرفة')}).filter(Boolean);
  return {id:'gen-'+Date.now()+'-'+Math.floor(Math.random()*99999),m:[slot],n:nm,
    d:'بنكهة '+E+' · '+Math.round(m.p)+' جم بروتين · جاهزة في '+t+' دقيقة.',
    k:Math.round(m.k/5)*5,p:Math.round(m.p),c:Math.round(m.c),f:Math.round(m.f),t:t,ex:[],
    ing:ing,st:st,gen:1};
}
window.dtGen=function(slot){
  dGenErr='';
  const have=new Set(ALLR().map(r=>r.n)), add=[];
  let none=0;
  for(let i=0;i<120&&add.length<4;i++){
    const r=makeRecipe(slot);
    if(!r){none++;continue}
    if(have.has(r.n))continue;
    have.add(r.n);add.push(r);
  }
  if(add.length){D().lib=(D().lib||[]).concat(add);save()}
  else dGenErr=none>100?'ما فيه مكونات كافية بعد استبعاداتك. خفّف الاستبعادات من الإعدادات.'
    :'جرّب مرة ثانية — كل التركيبات المتاحة موجودة عندك.';
  render();if(dOpen)renderSheet();
};

 [/بروتين|عضل/,'protein'],
 [/بدون\s*(نشو|كارب|كربوهيدرات|رز|خبز|مكرون)/,'lowcarb'],
 [/(أسرع|اسرع|سريع|دقايق|دقائق|مستعجل)/,'quick'],

window.dtAsk=function(){
  const el=$('daiin'),t=(el&&el.value||'').trim();
  if(!t){dAiErr='اكتب طلبك أولاً، مثل: بدون بصل وأسرع.';renderSheet();return}
  dAiText=t;
  const it=plan(dk_(dDate))[dOpen], base=it.cust?it.r:byIdR(it.r.id)||it.r;
  const mods=[];WORDS.forEach(w=>{if(w[0].test(t)&&!mods.includes(w[1]))mods.push(w[1])});
  const rm=[];const re=/بدون\s+([^\s،,.]+)/g;let mm;
  while((mm=re.exec(t)))if(!/زيت|نشو|كارب|كربوهيدرات/.test(mm[1]))rm.push(mm[1]);
  if(!mods.length&&!rm.length){
    dAiErr='ما فهمت الطلب. جرّب كلمات مثل: بدون بصل · بدون زيت · أسرع · بروتين أعلى · حصة أصغر.';
    renderSheet();return}
  let ing=base.ing.slice(), st=base.st.slice(), note=[];
  rm.forEach(w=>{const before=ing.length;
    ing=ing.filter(x=>!x.includes(w));
    if(ing.length<before)note.push('حذفنا '+w+' من المكونات.');
    st=st.map(x=>x.includes(w)?x.replace(new RegExp('\\\\s*(مع|و)?\\\\s*'+w,'g'),''):x)});
  const rec=Object.assign({},base,{id:'ed-'+Date.now(),m:[dOpen],ing:ing,st:st,ex:[],
    n:base.n+' (معدّلة)',d:base.d+(note.length?' '+note.join(' '):'')});
  dAiErr='';dAiText='';dMode='view';
  dSet(dOpen,{custom:rec,mods:mods,id:null});
  renderSheet();
};

window.dietBoot=async function(){
  if(!S.diet){
    const g=S.config||{};
    S.diet={pf:{sex:'m',age:35,w:85,h:175,
      act:(g.days>=5?'high':g.days<=3?'low':'mid'),
      goal:({fat:'cut',mus:'gain',both:'keep',str:'keep'}[g.goal]||'keep'),set:0},
      excl:[],custom:[],days:{},lib:[],weights:{}};
    /* ترحيل بيانات تطبيق الأكل القديم */
    const rd=async k=>{try{if(window.storage){const r=await window.storage.get(k);if(r&&r.value)return r.value}}catch(e){}
      try{return localStorage.getItem(k)}catch(e){}return null};
    try{const s=await rd('diet:settings');
      if(s){const v=JSON.parse(s);
        if(v.profile){S.diet.pf=Object.assign(S.diet.pf,v.profile);S.diet.pf.set=1}
        S.diet.excl=v.excl||[];S.diet.custom=v.custom||[]}}catch(e){}
    try{const x=await rd('diet:days');if(x)S.diet.days=JSON.parse(x)}catch(e){}
    try{const x=await rd('diet:lib');if(x)S.diet.lib=JSON.parse(x)}catch(e){}
    try{const x=await rd('diet:weights');if(x)S.diet.weights=JSON.parse(x)}catch(e){}

  const d=S.diet;d.excl=d.excl||[];d.custom=d.custom||[];d.days=d.days||{};d.lib=d.lib||[];d.weights=d.weights||{};

};

const eqName=id=>{const e=EQUIP.find(x=>x.id===id);return e?e.n:id};
const muOfP=p=>((PAT[p]||{}).m)||[];
function muMatch(a,b){
  const A=muOfP(a),B=muOfP(b);
  if(!A.length||!B.length)return 0;
  const inter=A.filter(x=>B.indexOf(x)>-1).length;
  return inter/Math.max(A.length,B.length);
}
const busyList=()=>S.busy||(S.busy=[]);
window.dtBusy=function(id){
  const b=busyList();
  S.busy=b.indexOf(id)>-1?b.filter(x=>x!==id):b.concat(id);
  save();if(swapCtx)openSwap(swapCtx.ei,swapCtx.di);
};
window.dtBusyClear=function(){S.busy=[];save();if(swapCtx)openSwap(swapCtx.ei,swapCtx.di)};

openSwap=function(ei,di){
  const dayIdx=(di!==undefined&&di!==null)?di:(S.session?S.session.di:0);
  swapCtx={ei,di:dayIdx};
  const e=S.program.days[dayIdx].ex[ei], cur=exOf(e.id), busy=busyList();
  const has=r=>S.config.eq.indexOf(r)>-1, free=r=>busy.indexOf(r)<0;
  const ready=x=>x.e.every(r=>has(r)&&free(r));
  const owned=x=>x.e.every(has);
  const list=EX.filter(x=>x.id!==e.id).map(x=>{
    const s=(x.p===e.slot)?1:muMatch(x.p,e.slot);
    return {x,s,ready:ready(x),owned:owned(x)};
  }).filter(o=>o.s>=.5)
    .sort((a,b)=>(b.ready-a.ready)||(b.s-a.s)||(b.owned-a.owned)||(a.x.e.length-b.x.e.length));
  const A=list.filter(o=>o.ready).slice(0,12);
  const B=list.filter(o=>!o.ready).slice(0,8);
  const lvl=s=>s===1?'نفس المجموعة تماماً':s>=.75?'بديل ممتاز':'بديل مقبول';
  const row=o=>{
    const need=o.x.e.length?o.x.e.map(eqName).join(' + '):'بدون معدات';
    const blocked=o.x.e.filter(r=>has(r)&&busy.indexOf(r)>-1).map(eqName);
    const missing=o.x.e.filter(r=>!has(r)).map(eqName);
    const mus=muOfP(o.x.p).map(m=>MN[m]).filter(Boolean).join(' · ');
    const ph=(S.photos||{})[o.x.id], cd=Object.keys(S.codes||{}).filter(k=>S.codes[k]===o.x.id);
    return '<button class="opt" onclick="'+(linkMode?'dtLink':'doSwap')+'(\''+o.x.id+'\')" style="align-items:flex-start">'+
      (ph?'<img src="'+ph+'" style="width:46px;height:46px;object-fit:cover;border-radius:8px;margin-left:10px">':'')+
      '<div style="flex:1"><b>'+esc(o.x.n)+'</b>'+(cd.length?' <span style="color:var(--blue);font-size:12px">كود مربوط</span>':'')+
      '<em>'+mus+' · '+lvl(o.s)+' · '+(o.x.t==='c'?'مركّب':'عزل')+'</em>'+
      '<em style="color:var(--steel)">'+need+
      (blocked.length?' — <span style="color:var(--red)">مشغول: '+blocked.join('، ')+'</span>':'')+
      (missing.length?' — <span style="color:var(--red)">ما اخترته بمعداتك</span>':'')+'</em></div></button>';
  };
  const eqUsed=[];EX.forEach(x=>x.e.forEach(r=>{if(has(r)&&eqUsed.indexOf(r)<0)eqUsed.push(r)}));
  const el=document.createElement('div');el.className='sheet';el.id='sheet';
  el.onclick=ev=>{if(ev.target===el)closeSheet()};
  el.innerHTML='<div class="sheet-in"><div class="between"><h3>بدائل '+esc(PNAME[e.slot]||'التمرين')+'</h3>'+
    '<button class="linkbtn" onclick="closeSheet()">إغلاق</button></div>'+
    '<div class="card" style="margin:10px 0"><b>'+esc(cur?cur.n:'')+'</b>'+
    '<div class="muted" style="font-size:13px">يستهدف: '+(muOfP(e.slot).map(m=>MN[m]).filter(Boolean).join(' · ')||'—')+
    '</div><div class="muted" style="font-size:13px">المجموعات والتكرارات ما تتغيّر مع التبديل.</div></div>'+
    (linkMode?'<div class="err" style="border-right-color:var(--blue);background:#EAF1FB">'+
      (linkMode.code?'كود جديد: <b>'+esc(linkMode.code)+'</b> — اختر التمرين اللي على الجهاز وبيتربط به.'
       :'اختر التمرين اللي بالصورة وبيتحفظ شكله للمرة الجاية.')+'</div>'+
      (linkMode.guess&&exOf(linkMode.guess)?'<div class="card" style="border-color:var(--blue)">'+
        '<b>يشبه: '+esc(exOf(linkMode.guess).n)+'</b><div class="muted" style="font-size:13px">'+
        'تطابق الصورة '+Math.round((1-linkMode.dist/64)*100)+'٪</div>'+
        '<div class="row" style="margin-top:8px"><button class="btn sm" onclick="dtLink(\''+linkMode.guess+
        '\')">نعم، اختر هذا</button></div></div>':''):
      '<div class="row" style="margin:10px 0"><button class="btn sm ghost" onclick="dtCam()">امسح كود الجهاز أو صوّره</button></div>')+
    '<div class="sec" style="margin:14px 0 6px">جهاز مشغول أو معطّل؟</div>'+
    '<p class="muted" style="margin:0 0 8px">اضغط على الجهاز عشان يختفي من البدائل مؤقتاً.</p>'+
    '<div class="chips">'+eqUsed.map(r=>'<button class="chip '+(busy.indexOf(r)>-1?'on':'')+
      '" onclick="dtBusy(\''+r+'\')">'+eqName(r)+'</button>').join('')+
    (busy.length?'<button class="chip" style="color:var(--blue)" onclick="dtBusyClear()">امسح الكل</button>':'')+'</div>'+
    '<div class="sec">جاهزة الحين ('+A.length+')</div>'+
    (A.length?'<div class="opts">'+A.map(row).join('')+'</div>'
      :'<div class="empty">كل البدائل تحتاج معدات مشغولة أو غير مختارة. جرّب امسح المشغول.</div>')+
    (B.length?'<div class="sec">تحتاج معدة ثانية</div><div class="opts">'+B.map(row).join('')+'</div>':'')+
    '<div style="height:20px"></div></div>';
  document.body.appendChild(el);
};

/* ================= كاميرا: باركود الجهاز + التعرّف بالصورة ================= */
let camStream=null,camTimer=null,camShot=null,linkMode=null;
const codes=()=>S.codes||(S.codes={});
const photos=()=>S.photos||(S.photos={});
const hashes=()=>S.hashes||(S.hashes={});

/* بصمة صورة 8×8 للمقارنة المحلية */
function aHash(video){
  const c=document.createElement('canvas');c.width=8;c.height=8;
  const x=c.getContext('2d');x.drawImage(video,0,0,8,8);
  const d=x.getImageData(0,0,8,8).data,g=[];
  for(let i=0;i<64;i++)g.push(.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2]);
  const m=g.reduce((a,b)=>a+b,0)/64;
  return g.map(v=>v>m?'1':'0').join('');
}
const hdist=(a,b)=>{let n=0;for(let i=0;i<64;i++)if(a[i]!==b[i])n++;return n};
function shrink(video){
  const c=document.createElement('canvas'),w=280,
    h=Math.round(w*(video.videoHeight||480)/(video.videoWidth||640));
  c.width=w;c.height=h;c.getContext('2d').drawImage(video,0,0,w,h);
  return c.toDataURL('image/jpeg',.55);
}
function camMsg(t){const el=$('cammsg');if(el)el.textContent=t}
window.dtCloseCam=function(){
  if(camTimer){clearInterval(camTimer);camTimer=null}
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}
  const el=$('camsheet');if(el)el.remove();
};
window.dtCam=async function(){
  camShot=null;
  const el=document.createElement('div');el.className='sheet';el.id='camsheet';
  el.onclick=e=>{if(e.target===el)dtCloseCam()};
  el.innerHTML='<div class="sheet-in"><div class="between"><h3>كاميرا الجهاز</h3>'+
    '<button class="linkbtn" onclick="dtCloseCam()">إغلاق</button></div>'+
    '<video id="camvid" autoplay muted playsinline style="width:100%;border-radius:var(--r);background:#000;max-height:46vh;object-fit:cover"></video>'+
    '<p class="muted" id="cammsg" style="margin:10px 0">جاري فتح الكاميرا…</p>'+
    '<div class="row"><button class="btn sm" onclick="dtShot()">التقط صورة الجهاز</button></div>'+
    '<div class="sec">أو أدخل الكود يدوياً</div>'+
    '<div class="row"><input id="camman" placeholder="اكتب الكود المكتوب على الجهاز" '+
    'style="flex:1;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#FAFAF9">'+
    '<button class="btn sm ghost" onclick="dtManual()">تأكيد</button></div>'+
    '<div style="height:16px"></div></div>';
  document.body.appendChild(el);
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    const v=$('camvid');v.srcObject=camStream;
    if('BarcodeDetector' in window){
      const det=new window.BarcodeDetector();
      camMsg('وجّه الكاميرا على الباركود أو QR الجهاز.');
      camTimer=setInterval(async()=>{
        try{const r=await det.detect(v);if(r&&r.length){const val=r[0].rawValue;
          if(val){clearInterval(camTimer);camTimer=null;dtCode(val)}}}catch(e){}
      },400);
    }else camMsg('متصفحك ما يدعم قراءة الباركود. صوّر الجهاز أو أدخل الكود يدوياً.');
  }catch(e){camMsg('ما قدرنا نفتح الكاميرا. تأكد من السماح للموقع، ولازم الرابط يكون https.')}
};
window.dtManual=function(){
  const el=$('camman'),v=(el&&el.value||'').trim();
  if(v)dtCode(v);else camMsg('اكتب الكود أولاً.');
};
function dtCode(code){
  const v=$('camvid');
  if(v&&v.videoWidth)camShot={img:shrink(v),h:aHash(v)};
  const ex=codes()[code];
  dtCloseCam();
  if(ex&&exOf(ex)){linkMode=null;doSwap(ex);return}
  linkMode={code:code,shot:camShot};
  if(swapCtx)openSwap(swapCtx.ei,swapCtx.di);
}
window.dtShot=function(){
  const v=$('camvid');
  if(!v||!v.videoWidth){camMsg('الكاميرا لسه ما جهزت.');return}
  const h=aHash(v),img=shrink(v);
  camShot={img:img,h:h};
  /* مطابقة محلية مع الأجهزة المصوّرة سابقاً */
  let best=null,bd=99;
  const H=hashes();
  for(const id in H){const d=hdist(H[id],h);if(d<bd){bd=d;best=id}}
  dtCloseCam();
  if(best&&bd<=10&&exOf(best)){
    linkMode={code:null,shot:camShot,guess:best,dist:bd};
  }else linkMode={code:null,shot:camShot};
  if(swapCtx)openSwap(swapCtx.ei,swapCtx.di);
};
window.dtLink=async function(exId){
  const lm=linkMode;linkMode=null;
  if(lm){
    if(lm.code)codes()[lm.code]=exId;
    if(lm.shot){
      photos()[exId]=lm.shot.img;hashes()[exId]=lm.shot.h;
      const ks=Object.keys(photos());
      if(ks.length>30){const drop=ks.slice(0,ks.length-30);
        drop.forEach(k=>{delete photos()[k];delete hashes()[k]})}
    }
    await save();
  }
  doSwap(exId);
};
window.dtUnlink=async function(exId){
  const c=codes();Object.keys(c).forEach(k=>{if(c[k]===exId)delete c[k]});
  delete photos()[exId];delete hashes()[exId];
  await save();render();
};
const _closeSheet2=closeSheet;
closeSheet=function(){linkMode=null;_closeSheet2()};

/* قسم الأجهزة المربوطة في الإعدادات */
window.dtGearSection=function(){
  const c=codes(),ph=photos(),ids={};
  Object.keys(c).forEach(k=>{(ids[c[k]]=ids[c[k]]||{codes:[]}).codes.push(k)});
  Object.keys(ph).forEach(id=>{ids[id]=ids[id]||{codes:[]}});
  const list=Object.keys(ids);
  if(!list.length)return '<div class="sec">أجهزة النادي</div><div class="card empty">ما ربطت أي جهاز بعد. من شاشة تبديل التمرين اضغط "امسح كود الجهاز أو صوّره".</div>';
  return '<div class="sec">أجهزة النادي ('+list.length+')</div><div class="card" style="padding:6px 16px 12px">'+
    list.map(id=>{const e=exOf(id);if(!e)return '';
      return '<div class="exrow"><div style="display:flex;align-items:center;gap:10px">'+
        (ph[id]?'<img src="'+ph[id]+'" style="width:42px;height:42px;object-fit:cover;border-radius:8px">':'')+
        '<div><b>'+esc(e.n)+'</b><div class="muted" style="font-size:12px">'+
        (ids[id].codes.length?'كود: '+ids[id].codes.map(esc).join('، '):'صورة محفوظة')+'</div></div></div>'+
        '<button class="linkbtn" style="color:var(--red)" onclick="dtUnlink(\''+id+'\')">حذف</button></div>'}).join('')+'</div>';
};
const _set2=settingsView;
settingsView=function(){return _set2().replace('<div style="height:30px"></div>','')+
  safe(dtGearSection)+'<div style="height:30px"></div>'};

const STOP=['http','https','www','com','net','org','sa','html','php','index','item','code','qr',
 'gym','fitness','club','equipment','model','serial','the','and','for','with'];
const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]+/g,' ').replace(/\s+/g,' ').trim();
const EQKW={'machine':['machine_press','machine_row','leg_machine'],'hammer':['machine_press','machine_row'],
 'جهاز':['machine_press','machine_row','leg_machine'],'dumbbell':['dumbbell'],'دمبل':['dumbbell'],
 'barbell':['barbell'],'بار':['barbell'],'cable':['cable'],'كيبل':['cable'],'كابل':['cable'],
 'band':['bands'],'أستك':['bands'],'استك':['bands'],'kettlebell':['kettlebell'],'كتل':['kettlebell'],
 'smith':['barbell','rack'],'rack':['rack'],'bench':['bench'],'بنش':['bench']};
const PKW={
 chest_h:['chest','bench','صدر','بنش','صدري'],chest_i:['incline','علوي','مائل'],
 chest_f:['fly','pec','deck','تفتيح','بيك'],
 back_v:['pulldown','lat','pullup','عقلة','لات','عمودي'],
 back_h:['row','rowing','تجديف','أفقي'],
 hinge:['deadlift','رفعة','ميتة','ديدلفت'],
 shoulder:['shoulder','overhead','كتف','اكتاف','أكتاف'],
 side:['lateral','رفرفة','جانبي','جانبية'],rear:['rear','خلفي','خلفية الكتف'],
 squat:['squat','سكوات','قرفصاء','هاك','ارجل','أرجل','رجل','ليج برس'],
 quad:['extension','اكستنشن','إكستنشن','لانج','lunge','أمامية'],
 ham:['hamstring','كيرل','خلفية الفخذ'],glute:['glute','hip','ثرست','مؤخرة','أرداف'],
 calf:['calf','بطات','سمانة'],bi:['biceps','باي','عضلة ذات'],
 tri:['triceps','تراي','pushdown','ترايسبس'],
 core:['abs','crunch','plank','بطن','بلانك','معدة'],
 cardio:['treadmill','bike','elliptical','كارديو','مشي','جري','دراجة','سير','ركض','تريدميل']};
function matchCode(raw){
  let t=raw;try{t=decodeURIComponent(t)}catch(e){}
  const clean=norm(t);
  const toks=clean.split(' ').filter(w=>w.length>2&&STOP.indexOf(w)<0&&!EQKW[w]&&!/^\d+$/.test(w));
  if(!toks.length)return null;
  /* معدات مذكورة في الكود */
  let wantEq=[];
  Object.keys(EQKW).forEach(k=>{if(clean.indexOf(k)>-1)wantEq=wantEq.concat(EQKW[k])});
  const eqBonus=x=>wantEq.length&&x.e.some(r=>wantEq.indexOf(r)>-1)?6:0;
  /* 1) مطابقة اسم التمرين مباشرة */
  let best=null,bs=0;
  EX.forEach(x=>{const hay=norm(x.n+' '+(EN[x.id]||''));
    let sc=0;toks.forEach(w=>{if(hay.indexOf(w)>-1)sc+=w.length});
    if(sc>=5)sc+=eqBonus(x);   /* المعدات ترجّح فقط لو الاسم نفسه تطابق */
    if(sc>bs){bs=sc;best=x}});
  if(bs>=8)return {ex:best,score:bs};
  /* أسماء دارجة في الأندية */
  const ALIAS={'سير':'cardio_m','مشاية':'cardio_m','تريدميل':'cardio_m','دراجة':'cardio_c',
   'سبينينج':'cardio_c','تجديف':'cardio_r','ستيرماستر':'cardio_s','نط':'cardio_j',
   'عقلة':'pull','متوازي':'dipc','هاك':'hack','بيك':'pdeck','سكوت':'sq','عقله':'pull'};
  for(const a in ALIAS){if(clean.indexOf(a)>-1&&exOf(ALIAS[a]))return {ex:exOf(ALIAS[a]),score:9}}
  /* 2) مطابقة المجموعة العضلية بالكلمات العربية أو الإنجليزية */
  let bp=null,bpS=0;
  Object.keys(PKW).forEach(p=>{
    let sc=0;PKW[p].forEach(w=>{if(clean.indexOf(norm(w))>-1)sc++});
    if(sc>bpS){bpS=sc;bp=p}});
  if(bp){
    const has=r=>S.config&&S.config.eq.indexOf(r)>-1;
    const pool=EX.filter(x=>x.p===bp).sort((a,b)=>
      (eqBonus(b)-eqBonus(a))||
      (b.e.every(has)-a.e.every(has))||
      ((b.t==='c')-(a.t==='c')));
    if(pool.length)return {ex:pool[0],score:6+bpS};
  }
  return null;
}
function guessName(raw){
  let t=raw;try{t=decodeURIComponent(t)}catch(e){}
  const seg=t.split(/[\/?#]/).filter(Boolean).pop()||t;
  const s=seg.replace(/[-_+.]+/g,' ').replace(/\.(html?|php)$/i,'').trim();
  return /[\u0600-\u06FF]/.test(s)||/[a-z]{3}/i.test(s)?s.slice(0,40):'';
}
window.dtToast=function(msg){
  const d=document.createElement('div');d.id='toast';
  d.style.cssText='position:fixed;inset-inline:0;bottom:86px;z-index:99;display:flex;justify-content:center;pointer-events:none';
  d.innerHTML='<div style="background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;max-width:88%">'+esc(msg)+'</div>';
  document.body.appendChild(d);setTimeout(()=>{const e=$('toast');if(e)e.remove()},2600);
};

/* --- نموذج إضافة تمرين --- */
let addF=null;
window.dtAddOpen=function(code,name){
  addF={n:name||'',p:'chest_h',e:[],t:'c',tip:'',code:code||'',from:!!swapCtx};
  renderAdd();
};
window.dtAddSet=function(k,v){addF[k]=v;renderAdd()};
window.dtAddTxt=function(k,v){addF[k]=v};
window.dtAddEq=function(id){addF.e=addF.e.indexOf(id)>-1?addF.e.filter(x=>x!==id):addF.e.concat(id);renderAdd()};
window.dtAddClose=function(){addF=null;const el=$('addsheet');if(el)el.remove()};
window.dtAddScan=function(){dtAddClose();dtCam(1)};
window.dtAddSave=async function(){
  const nEl=$('axn'),tEl=$('axt'),cEl=$('axc');
  if(nEl)addF.n=(nEl.value||'').trim();
  if(tEl)addF.tip=(tEl.value||'').trim();
  if(cEl)addF.code=(cEl.value||'').trim();
  if(!addF.n){dtToast('اكتب اسم التمرين أولاً');return}
  const id='cx'+Date.now().toString(36);
  const rec={id:id,n:addF.n,p:addF.p,e:addF.e.slice(),t:addF.t,
    tip:addF.tip||'تمرين مضاف من عندك',en:addF.n};
  S.cex=(S.cex||[]).concat(rec);
  EX.push({id:rec.id,n:rec.n,p:rec.p,e:rec.e,t:rec.t,tip:rec.tip});EN[id]=rec.en;
  if(addF.code)codes()[addF.code]=id;
  const from=addF.from;
  addF=null;dtAddClose();await save();
  dtToast('انضاف: '+rec.n);
  if(from&&swapCtx)doSwap(id);else render();
};
window.dtDelEx=async function(id){
  S.cex=(S.cex||[]).filter(x=>x.id!==id);
  const i=EX.findIndex(x=>x.id===id);if(i>-1)EX.splice(i,1);
  const c=codes();Object.keys(c).forEach(k=>{if(c[k]===id)delete c[k]});
  await save();render();
};
function renderAdd(){
  let el=$('addsheet');
  if(!addF){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.className='sheet';el.id='addsheet';
    el.onclick=e=>{if(e.target===el)dtAddClose()};document.body.appendChild(el)}
  const inp=(id,ph,val)=>'<input id="'+id+'" value="'+esc(val||'')+'" placeholder="'+ph+
    '" oninput="dtAddTxt(\''+({axn:'n',axt:'tip',axc:'code'}[id])+'\',this.value)" '+
    'style="width:100%;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#FAFAF9">';
  el.innerHTML='<div class="sheet-in"><div class="between"><h3>إضافة تمرين</h3>'+
    '<button class="linkbtn" onclick="dtAddClose()">إغلاق</button></div>'+
    '<div class="sec" style="margin-top:12px">اسم التمرين</div>'+inp('axn','مثال: جهاز الضغط الصدري',addF.n)+
    '<div class="sec">المجموعة العضلية</div><div class="chips">'+
      Object.keys(PNAME).map(p=>'<button class="chip '+(addF.p===p?'on':'')+'" onclick="dtAddSet(\'p\',\''+p+'\')">'+PNAME[p]+'</button>').join('')+'</div>'+
    '<div class="muted" style="font-size:13px;margin-top:6px">يستهدف: '+
      (muOfP(addF.p).map(m=>MN[m]).filter(Boolean).join(' · ')||'—')+'</div>'+
    '<div class="sec">المعدات المطلوبة</div><div class="chips">'+
      EQUIP.map(q=>'<button class="chip '+(addF.e.indexOf(q.id)>-1?'on':'')+'" onclick="dtAddEq(\''+q.id+'\')">'+q.n+'</button>').join('')+
      '</div><div class="muted" style="font-size:13px;margin-top:6px">'+(addF.e.length?'':'بدون معدات = تمرين وزن الجسم')+'</div>'+
    '<div class="sec">النوع</div><div class="chips">'+
      '<button class="chip '+(addF.t==='c'?'on':'')+'" onclick="dtAddSet(\'t\',\'c\')">مركّب</button>'+
      '<button class="chip '+(addF.t==='i'?'on':'')+'" onclick="dtAddSet(\'t\',\'i\')">عزل</button></div>'+
    '<div class="sec">ملاحظة تكنيك (اختياري)</div>'+inp('axt','مثال: المقبض بمستوى منتصف الصدر',addF.tip)+
    '<div class="sec">كود الجهاز (اختياري)</div>'+
    '<div class="row">'+inp('axc','امسحه أو اكتبه',addF.code)+
      '<button class="btn sm ghost" style="flex:0 0 90px" onclick="dtAddScan()">امسح</button></div>'+
    '<div class="muted" style="font-size:13px;margin-top:6px">لما تربط الكود، أي مسح له بعدين يفتح هذا التمرين مباشرة.</div>'+
    '<div class="row" style="margin-top:16px"><button class="btn" onclick="dtAddSave()">احفظ التمرين</button></div>'+
    '<div style="height:20px"></div></div>';
}

/* --- إعادة تعريف مسار الكود: يقرأ ويضيف مباشرة --- */
dtCode=function(code){
  const v=$('camvid');
  if(v&&v.videoWidth)camShot={img:shrink(v),h:aHash(v)};
  const known=codes()[code];
  dtCloseCam();
  if(known&&exOf(known)){linkMode=null;dtToast('الجهاز: '+exOf(known).n);doSwap(known);return}
  const m=matchCode(code);
  if(m){
    codes()[code]=m.ex.id;
    if(camShot){photos()[m.ex.id]=camShot.img;hashes()[m.ex.id]=camShot.h}
    save();linkMode=null;
    dtToast('تعرّفنا على: '+m.ex.n);
    doSwap(m.ex.id);return;
  }
  /* كود غير معروف: يفتح نموذج الإضافة جاهز بالاسم والكود */
  linkMode=null;
  dtAddOpen(code,guessName(code));
  dtToast('كود جديد — أكمل بيانات التمرين مرة وحدة');
};
window.dtCam=function(fromAdd){
  camShot=null;
  const el=document.createElement('div');el.className='sheet';el.id='camsheet';
  el.onclick=e=>{if(e.target===el)dtCloseCam()};
  el.innerHTML='<div class="sheet-in"><div class="between"><h3>كاميرا الجهاز</h3>'+
    '<button class="linkbtn" onclick="dtCloseCam()">إغلاق</button></div>'+
    '<video id="camvid" autoplay muted playsinline style="width:100%;border-radius:var(--r);background:#000;max-height:46vh;object-fit:cover"></video>'+
    '<p class="muted" id="cammsg" style="margin:10px 0">جاري فتح الكاميرا…</p>'+
    (fromAdd?'':'<div class="row"><button class="btn sm" onclick="dtShot()">التقط صورة الجهاز</button>'+
      '<button class="btn sm ghost" onclick="dtCloseCam();dtAddOpen()">إضافة يدوية</button></div>')+
    '<div class="sec">أو أدخل الكود يدوياً</div>'+
    '<div class="row"><input id="camman" placeholder="اكتب الكود المكتوب على الجهاز" '+
    'style="flex:1;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#FAFAF9">'+
    '<button class="btn sm ghost" onclick="dtManual()">تأكيد</button></div>'+
    '<div style="height:16px"></div></div>';
  document.body.appendChild(el);
  startCam();
};
async function startCam(){
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    const v=$('camvid');v.srcObject=camStream;
    if('BarcodeDetector' in window){
      const det=new window.BarcodeDetector();
      camMsg('وجّه الكاميرا على الباركود أو QR الجهاز.');
      camTimer=setInterval(async()=>{
        try{const r=await det.detect(v);if(r&&r.length&&r[0].rawValue){
          clearInterval(camTimer);camTimer=null;dtCode(r[0].rawValue)}}catch(e){}
      },400);
    }else camMsg('متصفحك ما يدعم قراءة الباركود. صوّر الجهاز أو أدخل الكود يدوياً.');
  }catch(e){camMsg('ما قدرنا نفتح الكاميرا. تأكد من السماح للموقع، ولازم الرابط https.')}
}

/* --- زر الإضافة داخل شاشة البدائل --- */
const _openSwap3=openSwap;
openSwap=function(ei,di){
  _openSwap3(ei,di);
  const el=$('sheet');if(!el)return;
  el.innerHTML=el.innerHTML.replace('<div class="sec" style="margin:14px 0 6px">جهاز مشغول أو معطّل؟</div>',
    '<div class="row" style="margin:0 0 10px"><button class="btn sm ghost" onclick="dtAddOpen()">+ إضافة تمرين يدوياً</button></div>'+
    '<div class="sec" style="margin:14px 0 6px">جهاز مشغول أو معطّل؟</div>');
};

/* --- تحميل التمارين المضافة عند التشغيل --- */
(S.cex||[]).forEach(function(){});
const _boot=dietBoot;
dietBoot=async function(){
  await _boot();
  (S.cex||[]).forEach(r=>{if(!EX.some(x=>x.id===r.id)){
    EX.push({id:r.id,n:r.n,p:r.p,e:r.e||[],t:r.t||'c',tip:r.tip||''});EN[r.id]=r.en||r.n}});
};

/* --- قسم تماريني في الإعدادات --- */
window.dtMyExSection=function(){
  const l=S.cex||[];
  return '<div class="sec">تماريني المضافة ('+l.length+')</div>'+
    '<div class="card"><div class="row" style="margin-bottom:'+(l.length?'12px':'0')+'">'+
    '<button class="btn sm ghost" onclick="dtAddOpen()">+ إضافة تمرين</button></div>'+
    (l.length?l.map(r=>'<div class="exrow"><div><b>'+esc(r.n)+'</b>'+
      '<div class="muted" style="font-size:12px">'+(PNAME[r.p]||'')+' · '+
      (r.e&&r.e.length?r.e.map(eqName).join(' + '):'بدون معدات')+'</div></div>'+
      '<button class="linkbtn" style="color:var(--red)" onclick="dtDelEx(\''+r.id+'\')">حذف</button></div>').join('')
     :'<p class="muted" style="margin:10px 0 0">أضف أي جهاز في ناديك مو موجود بالقائمة.</p>')+'</div>';
};
const _set3=settingsView;
settingsView=function(){return _set3().replace('<div style="height:30px"></div>','')+
  safe(dtMyExSection)+'<div style="height:30px"></div>'};

})();
</script>
